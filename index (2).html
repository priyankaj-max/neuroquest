<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroQuest: The AI Adventure</title>
<style>
:root{--parch:#f4e4bf;--parch2:#ead3a0;--card:#fbf0d3;--ink:#3b2412;--mut:#7a5b3a;--wood:#6b4423;--wood2:#8d5b2b;--line:#cdb07a;--gold:#c98a12;--gold2:#f2c84f;--green:#3f7d3a;--red:#a8322d;--blue:#2f6f95;--ok:#3d7f3a;--bad:#a8322d;--okbg:rgba(63,125,58,.14);--badbg:rgba(168,50,45,.12);--shadow:0 8px 22px rgba(80,48,10,.22)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;color:var(--ink);min-height:100vh;
 background:radial-gradient(1200px 700px at 50% -10%,#fff2cf,transparent 70%),repeating-linear-gradient(45deg,rgba(120,80,30,.035) 0 2px,transparent 2px 6px),var(--parch)}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:8px 14px;border-radius:12px;background:linear-gradient(#7d5026,#5b3819);color:#fbeec8;box-shadow:var(--shadow);border-bottom:3px solid var(--gold)}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:400;font-size:.7rem;opacity:.8;letter-spacing:.5px}
button{font:inherit;color:inherit;cursor:pointer}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;color:#fbeec8}
.hbtn:hover{background:rgba(255,255,255,.25)}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:1.5rem}h3{font-size:1.1rem;color:var(--wood);border-bottom:1px solid var(--line);padding-bottom:5px}
.card{background:linear-gradient(var(--card),#f7e8c4);border:2px solid var(--wood2);border-radius:14px;padding:20px;box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.35)}
.lead{color:var(--mut);line-height:1.6;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid2>*{min-width:0}
label.f{display:block;font-size:.75rem;font-weight:700;color:var(--wood2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1.3px}
input[type=text],select{width:100%;background:#fffaf0;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
input[type=text]:focus,select:focus{border-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:70px;background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:9px 6px}
.seg button:hover{border-color:var(--gold)}
.seg button.on{background:linear-gradient(#f6d76a,#d9a21c);border-color:var(--wood2);font-weight:700}
.av{display:grid;grid-template-columns:repeat(6,1fr)}.av button{min-width:0;font-size:1.5rem;padding:6px 0}
.btn{display:block;width:100%;margin-top:14px;border:2px solid #3f2610;border-bottom-width:4px;border-radius:12px;padding:12px 14px;font-weight:700;font-size:1.05rem;color:#fff4d6;background:linear-gradient(#a8692f,#7a4720);text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 5px 12px rgba(60,30,5,.3);transition:.12s}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.green{background:linear-gradient(#58a04a,#3a7a33)}
.btn.gold{background:linear-gradient(#f4cf5b,#c98a12);color:#3b2412;text-shadow:none}
.btn.ghost{background:#fffaf0;color:var(--wood);text-shadow:none;border-color:var(--line);border-bottom-width:2px;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;flex-wrap:wrap;gap:10px}.row2>*{flex:1;min-width:140px;margin-top:10px}
.hero-scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--wood);box-shadow:var(--shadow);margin-bottom:16px;background:#bfe6f5}
.hero-scene svg{display:block;width:100%;height:auto}
.title-block{position:absolute;left:4%;top:8%;right:4%;text-align:left;pointer-events:none}
.t-top{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:#5b3819;font-weight:700}
.logo-t{font-size:clamp(2.2rem,8vw,4.4rem);margin:2px 0 0;font-weight:900;letter-spacing:2px;background:linear-gradient(#fff3b0,#f0b429 55%,#b87310);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5b3819) drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.t-sub{font-size:clamp(1rem,3.2vw,1.6rem);font-style:italic;color:#4a2c12;font-weight:700;text-shadow:0 1px 0 #fff3c4}
.cloud{animation:drift 40s linear infinite}.cloud.c2{animation-duration:55s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1000px)}}
.glow{animation:glow 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{50%{opacity:.55;transform:scale(1.12)}}
.flag{animation:wave 1.4s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
@keyframes wave{50%{transform:skewY(8deg) scaleX(.9)}}
.hud-card{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:12px 16px}
.avatar{font-size:2.6rem;width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(#fff8dc,#f0cf7a);border:3px solid var(--wood2)}
.hud-main{flex:1;min-width:0}.hud-name{font-weight:700;font-size:1.15rem}.hud-sub{color:var(--mut);font-size:.88rem;margin-bottom:5px}
.bar{height:10px;background:#e3cd9a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:linear-gradient(90deg,#58a04a,#f2c84f);width:0;transition:width .4s}
.tbar>div{background:#58a04a;transition:width .25s linear,background .3s}.tbar.low>div{background:var(--red)}
.hud-side{text-align:center;font-size:.8rem;color:var(--mut)}.hud-side b{display:block;font-size:1.4rem;color:var(--wood)}
.mapwrap{border-radius:16px;overflow:hidden;border:4px solid var(--wood);box-shadow:var(--shadow);background:#efd9a6}
.mapwrap svg{display:block;width:100%;height:auto}
.node{cursor:pointer}.node.locked{cursor:not-allowed}
.node:hover:not(.locked) .nring{stroke-width:6}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.18);opacity:.35}}
.bob{animation:bob 1.1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.72rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:#fffaf0}
.chip.Easy{color:var(--ok);border-color:var(--ok)}.chip.Medium{color:#9a6a0b;border-color:#9a6a0b}.chip.Hard{color:var(--bad);border-color:var(--bad)}
.chip.app{color:var(--blue);border-color:var(--blue);font-weight:700}.chip.srch{color:#7a3e9d;border-color:#7a3e9d;font-weight:700}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.9rem}
.stat{background:linear-gradient(#7d5026,#5b3819);color:#fbeec8;border-radius:10px;padding:5px 12px}.stat b{color:var(--gold2)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e3cd9a;border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)}.dots i.bad{background:var(--bad);border-color:var(--bad)}.dots i.skip{background:#999;border-color:#999}.dots i.cur{background:var(--gold2);border-color:var(--wood2);transform:scale(1.25)}
.qcard{position:relative}
.qcard.boss{border-color:var(--red);box-shadow:var(--shadow),0 0 0 3px rgba(168,50,45,.25),inset 0 0 0 3px rgba(255,255,255,.35)}
.bossbanner{background:linear-gradient(#c0443a,#8c2420);color:#fff2d6;text-align:center;font-weight:800;letter-spacing:2px;border-radius:8px;padding:5px;margin:-6px 0 12px;animation:glowb 1.5s ease-in-out infinite}
@keyframes glowb{50%{filter:brightness(1.25)}}
.q{font-size:1.2rem;line-height:1.6;margin:6px 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fffaf0;border:2px solid var(--line);border-radius:12px;padding:11px 14px;transition:.12s;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px);background:#fff3cf}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:linear-gradient(#a8692f,#7a4720);color:#fff2d0;display:grid;place-items:center;font-weight:800;font-size:.85rem;border:1px solid #3f2610}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .k{background:var(--bad)}
.opt.gone{opacity:.25;text-decoration:line-through;pointer-events:none}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.rowm{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px}
@media(max-width:560px){.rowm{grid-template-columns:1fr}}
.rowm .l{background:#fffaf0;border:2px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:9px 12px}
.lifelines{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding-top:12px;border-top:2px dashed var(--line)}
.ll{background:#fffaf0;border:2px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.85rem}
.ll:hover:not(:disabled){border-color:var(--gold)}.ll:disabled{opacity:.4;cursor:not-allowed}
.hintbox,.fb{margin-top:14px;border-radius:12px;padding:12px 16px;line-height:1.6}
.hintbox{background:#fff0bd;border:2px dashed var(--gold)}
.fb{background:#fffaf0;border:2px solid var(--line);border-left:7px solid var(--line)}.fb.ok{border-left-color:var(--ok)}.fb.bad{border-left-color:var(--bad)}
.fb h3{border:0;padding:0;font-size:1.1rem}.pts{color:var(--green);font-weight:800}
.big{font-size:3.4rem;font-weight:900;color:var(--wood);line-height:1.1}
.rank{font-style:italic;font-size:1.2rem;margin:4px 0 12px;color:var(--gold)}
.stars{font-size:2.2rem;letter-spacing:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:1.35rem;color:var(--wood)}.kpi span{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.tb{display:grid;grid-template-columns:170px 1fr 50px;gap:8px;align-items:center;font-size:.82rem;margin:6px 0}
@media(max-width:560px){.tb{grid-template-columns:105px 1fr 44px}}.tb span:first-child{overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
th{color:var(--wood2);font-size:.72rem;text-transform:uppercase;letter-spacing:1px}
#lbbox{overflow-x:auto}
.x{background:transparent;border:0;color:var(--mut);padding:2px 7px;border-radius:4px}.x:hover{color:var(--bad);background:var(--badbg)}
details{background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0}summary{cursor:pointer;font-weight:700}
.ribbon{display:inline-block;background:linear-gradient(#c0443a,#8c2420);color:#fff2d6;font-weight:800;letter-spacing:3px;padding:6px 26px;border-radius:4px;text-transform:uppercase;font-size:.85rem}
.scroll{background:linear-gradient(#fbf0d3,#f1dcaa);border:6px double var(--wood2);border-radius:10px;padding:26px;text-align:center;box-shadow:var(--shadow)}
.certname{font-style:italic;font-size:2.2rem;margin:4px 0;color:var(--wood)}
.seal{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(#d8483c,#8c2420);color:#ffe9b5;font-size:1.8rem;box-shadow:0 3px 8px rgba(0,0,0,.35);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#3b2412;color:#fbeec8;padding:10px 18px;border-radius:99px;z-index:120;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.conf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
.foot{margin-top:18px;color:var(--mut);font-size:.75rem;text-align:center}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.75rem;background:#fffaf0}
.puz{display:grid;grid-template-columns:repeat(3,88px);gap:8px;justify-content:center;margin:14px auto}
.tile{width:88px;height:88px;border-radius:10px;border:3px solid var(--wood2);background:linear-gradient(#f7e2a8,#e2bd72);font-size:2rem;font-weight:800;color:var(--wood);box-shadow:0 4px 8px rgba(0,0,0,.2);transition:.12s}
.tile:hover:not(:disabled){transform:translateY(-2px)}.tile.blank{background:transparent;border:2px dashed var(--line);box-shadow:none}
.tile.good{background:linear-gradient(#bfe3a4,#8fc477);border-color:var(--ok);color:#1f4d1c}
.tile.hint{outline:4px solid var(--gold2);outline-offset:2px;animation:blink 1s infinite}@keyframes blink{50%{outline-color:transparent}}
.nd{cursor:pointer}.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:5px;vertical-align:-3px;border:1px solid rgba(0,0,0,.3)}
.lvup{background:linear-gradient(#f4cf5b,#c98a12);color:#3b2412;font-weight:800;border-radius:10px;padding:10px;text-align:center;margin:10px 0;animation:glowb 1s ease-in-out infinite}
@media print{body{background:#fff!important}header,.foot,.noprint{display:none!important}.card,.scroll{box-shadow:none!important}}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🏰 NeuroQuest <small>The AI Adventure</small></div>
    <button class="hbtn" id="soundBtn" aria-label="Toggle sound">🔊</button>
  </header>
  <main id="app"></main>
  <div class="foot">Keyboard: <span class="kbd">1</span>–<span class="kbd">4</span> choose an option · <span class="kbd">Enter</span> submit / next</div>
</div>
<script>
const QDATA = [{"topic": "Foundations & Applications", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "Russell & Norvig group definitions of AI into four approaches. A system built to 'do the right thing, given what it knows' follows which approach?", "hint": "Think 'agent'.", "exp": "Acting rationally = the rational-agent approach: choose actions that maximise expected success given available knowledge. It is the approach the textbook adopts.", "app": false, "search": false, "opts": ["Thinking humanly", "Acting humanly", "Thinking rationally", "Acting rationally"], "ans": 3, "id": 1}, {"topic": "Foundations & Applications", "diff": "Easy", "type": "Scenario", "fmt": "opts", "q": "A hospital installs software that scans chest X-rays and highlights regions that may show pneumonia. Which AI sub-field is mainly at work?", "hint": "The input is a picture.", "exp": "Interpreting images is the job of computer vision (perception).", "app": true, "search": false, "opts": ["Computer vision", "Speech recognition", "Natural language generation", "Automated planning"], "ans": 0, "id": 2}, {"topic": "Foundations & Applications", "diff": "Easy", "type": "Fill in the Blank", "fmt": "fill", "q": "The AI sub-field that lets machines understand and generate human language is called ________ (abbreviation accepted).", "hint": "Three words, abbreviated N-L-P.", "exp": "NLP covers parsing, translation, question answering and chatbots.", "app": false, "search": false, "accept": ["nlp", "natural language processing", "natural language processing nlp"], "answerText": "Natural Language Processing (NLP)", "id": 3}, {"topic": "Foundations & Applications", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "Which contributing discipline gave AI the ideas of utility and decision theory (maximising expected outcomes)?", "hint": "Think of money, preferences and trade-offs.", "exp": "Economics formalised utility, decision theory and game theory, which underpin rational-agent design.", "app": false, "search": false, "opts": ["Neuroscience", "Economics", "Linguistics", "Control theory"], "ans": 1, "id": 4}, {"topic": "Foundations & Applications", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "An email service learns from millions of user-labelled messages to decide whether a new email is spam. This is best described as:", "hint": "The system gets better with data.", "exp": "The filter improves from labelled examples rather than from fixed human-written rules, which is the definition of machine learning.", "app": true, "search": false, "opts": ["A hand-coded rule list", "Machine learning – improving performance from experience", "Means-end analysis", "Constraint satisfaction"], "ans": 1, "id": 5}, {"topic": "Turing Test", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "In Turing's imitation game, a computer passes the test when:", "hint": "It is about indistinguishability.", "exp": "Passing means the interrogator, after written questions, cannot reliably tell machine from human.", "app": false, "search": false, "opts": ["It beats a grandmaster at chess", "A human interrogator cannot tell whether written replies come from a person or a machine", "It solves 100 logic puzzles", "It has a human-like body"], "ans": 1, "id": 6}, {"topic": "Turing Test", "diff": "Medium", "type": "True/False", "fmt": "opts", "q": "The basic (text-only) Turing Test requires the computer to have a physical body and robotic arms.", "hint": "Is the interrogator allowed to see the machine?", "exp": "That is the Total Turing Test. The basic test only needs text conversation, so no body is required.", "app": false, "search": false, "opts": ["True", "False"], "ans": 1, "id": 7}, {"topic": "Turing Test", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "Which pair of capabilities is needed ONLY for the Total Turing Test and not the basic Turing Test?", "hint": "Which two let a machine see and move?", "exp": "The Total Turing Test adds a video signal (computer vision) and physical objects passed through a hatch (robotics) on top of the four basic capabilities.", "app": false, "search": false, "opts": ["Natural language processing and machine learning", "Knowledge representation and automated reasoning", "Computer vision and robotics", "Machine learning and knowledge representation"], "ans": 2, "id": 8}, {"topic": "Turing Test", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A customer-support chatbot must remember that the user said earlier 'my order #4521 is late' and use that fact several messages later. Which Turing-Test capability is this?", "hint": "It is about storing facts.", "exp": "Storing what the system knows or hears during the conversation is knowledge representation. Using it to draw conclusions is automated reasoning.", "app": true, "search": false, "opts": ["Knowledge representation", "Computer vision", "Robotics", "Speech synthesis"], "ans": 0, "id": 9}, {"topic": "Turing Test", "diff": "Hard", "type": "Assertion–Reason", "fmt": "opts", "q": "Assertion (A): A program could pass the Turing Test and still not truly 'understand' anything.\nReason (R): The test judges only observable conversational behaviour, not the internal processes behind it.", "hint": "What does the test actually observe?", "exp": "This is the idea behind Searle's Chinese Room argument. Because the test measures behaviour only, passing it does not prove real understanding.", "app": false, "search": false, "opts": ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is NOT the correct explanation of A", "A is true, but R is false", "A is false, but R is true"], "ans": 0, "id": 10}, {"topic": "Rational Agents", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "Which statement best defines a rational agent?", "hint": "Key word: expected.", "exp": "Rationality is about maximising EXPECTED performance with the information available, not guaranteed success.", "app": false, "search": false, "opts": ["It always achieves the best possible outcome", "For each percept sequence it selects the action expected to maximise its performance measure, given its evidence and built-in knowledge", "It copies human behaviour exactly", "It knows everything about its environment"], "ans": 1, "id": 11}, {"topic": "Rational Agents", "diff": "Easy", "type": "True/False", "fmt": "opts", "q": "A rational agent is the same as an omniscient agent.", "hint": "Can anyone know the future?", "exp": "An omniscient agent knows the actual outcome of every action, which is impossible in practice. Rationality maximises expected, not actual, performance.", "app": false, "search": false, "opts": ["True", "False"], "ans": 1, "id": 12}, {"topic": "Rational Agents", "diff": "Medium", "type": "Assertion–Reason", "fmt": "opts", "q": "Assertion (A): A rational agent always achieves the best possible actual outcome.\nReason (R): Rationality maximises expected performance based on the percepts and knowledge the agent has.", "hint": "Expected vs actual.", "exp": "A is false because uncertainty and incomplete information can lead a rational choice to turn out badly. R is true and is the actual definition.", "app": false, "search": false, "opts": ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is NOT the correct explanation of A", "A is true, but R is false", "A is false, but R is true"], "ans": 3, "id": 13}, {"topic": "Intelligent Agents", "diff": "Easy", "type": "Scenario", "fmt": "opts", "q": "A home thermostat switches the heater ON whenever the sensed temperature is below 20 °C. Which agent type is this?", "hint": "No memory, just IF-THEN.", "exp": "It uses a direct condition-action rule on the current percept only, with no memory or model, so it is a simple reflex agent.", "app": true, "search": false, "opts": ["Simple reflex agent", "Model-based reflex agent", "Goal-based agent", "Utility-based agent"], "ans": 0, "id": 14}, {"topic": "Intelligent Agents", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A robot vacuum senses only the room it is in, but remembers which rooms it has already cleaned. This internal memory makes it a:", "hint": "It keeps internal state.", "exp": "Keeping internal state to track unobserved parts of the world is what makes an agent model-based; it helps with partial observability.", "app": true, "search": false, "opts": ["Simple reflex agent", "Model-based reflex agent", "Table-driven agent with an infinite table", "Random agent"], "ans": 1, "id": 15}, {"topic": "Intelligent Agents", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A maps app picks among routes by trading off travel time, toll cost and safety, assigning each a numeric score. Which agent type is this?", "hint": "Numbers that measure 'how happy'.", "exp": "When goals conflict or can be achieved to different degrees, a utility function lets the agent compare and trade off outcomes, which is a utility-based agent.", "app": true, "search": false, "opts": ["Simple reflex", "Goal-based", "Utility-based", "Learning only"], "ans": 2, "id": 16}, {"topic": "Intelligent Agents", "diff": "Medium", "type": "Fill in the Blank", "fmt": "fill", "q": "In a learning agent, the component that tells the learning element how well the agent is doing against a fixed performance standard is the ________.", "hint": "It gives feedback, like a judge.", "exp": "The four parts are the performance element, learning element, critic and problem generator.", "app": false, "search": false, "accept": ["critic"], "answerText": "Critic", "id": 17}, {"topic": "Intelligent Agents", "diff": "Easy", "type": "Fill in the Blank", "fmt": "fill", "q": "PEAS stands for Performance measure, Environment, Actuators and ________.", "hint": "How does the agent perceive?", "exp": "PEAS describes the task environment of an agent, e.g. an automated taxi.", "app": false, "search": false, "accept": ["sensors", "sensor"], "answerText": "Sensors", "id": 18}, {"topic": "Agents & Environments", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "The mathematical mapping from percept sequences to actions is called the:", "hint": "Function vs program.", "exp": "The agent function is the abstract mapping. The agent program is the concrete code that implements it.", "app": false, "search": false, "opts": ["Agent program", "Agent function", "Transition model", "Heuristic"], "ans": 1, "id": 19}, {"topic": "Agents & Environments", "diff": "Medium", "type": "True/False", "fmt": "opts", "q": "Two different agent programs can implement the same agent function.", "hint": "Same behaviour, different code.", "exp": "The function only specifies input-output behaviour, so many programs (different code or data structures) can realise it.", "app": false, "search": false, "opts": ["True", "False"], "ans": 0, "id": 20}, {"topic": "Agents & Environments", "diff": "Medium", "type": "Problem Solving", "fmt": "fill", "q": "In the two-square vacuum world, the agent senses (location, status) with location ∈ {A, B} and status ∈ {Clean, Dirty}. How many different single percepts are possible? (enter a number)", "hint": "Multiply the options.", "exp": "2 locations × 2 statuses = 4 percepts: [A,Clean], [A,Dirty], [B,Clean], [B,Dirty].", "app": false, "search": false, "accept": ["4", "four"], "answerText": "4", "id": 21}, {"topic": "Good Behaviour", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A vacuum robot is rewarded +1 for every unit of dirt it cleans. It learns to dump dirt on the floor and clean it up again to keep earning points. What does this teach about performance measures?", "hint": "Reward the outcome, not the activity.", "exp": "Rewarding 'dirt cleaned' encourages gaming the measure. A better measure is 'clean floor over time', which rewards the state you actually want.", "app": true, "search": false, "opts": ["Robots should never be rewarded", "Performance measures should reward the desired state of the environment, not the agent's activity", "More reward always improves behaviour", "Rationality has no connection to performance measures"], "ans": 1, "id": 22}, {"topic": "Nature of Environments", "diff": "Medium", "type": "Match the Following", "fmt": "match", "q": "Match each task environment with the property that best describes it.", "hint": "Use elimination.", "exp": "Poker hides opponents' cards. Each part classification is independent (episodic). Traffic changes while you think and states are continuous. A crossword stays still and has no randomness.", "app": false, "search": false, "left": ["Poker", "Classifying parts on an assembly line", "Driving a taxi", "Solving a crossword"], "right": ["Partially observable", "Episodic", "Dynamic and continuous", "Static and deterministic"], "id": 23}, {"topic": "Nature of Environments", "diff": "Hard", "type": "MCQ", "fmt": "opts", "q": "Which description fits chess played with a clock?", "hint": "The clock makes it semi-dynamic.", "exp": "The whole board is visible, moves have no randomness, the environment is unchanged by time but the score depends on it (semi-dynamic), positions are discrete, and there are two agents.", "app": false, "search": false, "opts": ["Partially observable, stochastic, continuous", "Fully observable, deterministic, semi-dynamic, discrete, multi-agent", "Fully observable, stochastic, dynamic", "Partially observable, static, single-agent"], "ans": 1, "id": 24}, {"topic": "Nature of Environments", "diff": "Easy", "type": "True/False", "fmt": "opts", "q": "In a deterministic environment, the next state is completely determined by the current state and the agent's action.", "hint": "No dice.", "exp": "No randomness is involved. If any uncertainty exists, the environment is stochastic.", "app": false, "search": false, "opts": ["True", "False"], "ans": 0, "id": 25}, {"topic": "Nature of Environments", "diff": "Medium", "type": "Assertion–Reason", "fmt": "opts", "q": "Assertion (A): A crossword puzzle is a static environment.\nReason (R): In a static environment the world keeps changing while the agent is deliberating.", "hint": "Which one changes while you think?", "exp": "A is true because a crossword does not change while you think. R is false because that describes a DYNAMIC environment.", "app": false, "search": false, "opts": ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is NOT the correct explanation of A", "A is true, but R is false", "A is false, but R is true"], "ans": 2, "id": 26}, {"topic": "Problems & Problem Spaces", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "Which of the following is NOT one of the five components of a formal problem definition?", "hint": "One of these is optional guidance.", "exp": "A formal problem has an initial state, actions, a transition model, a goal test and a path cost. A heuristic is extra information used by informed search, not part of the definition.", "app": false, "search": false, "opts": ["Initial state", "Actions and transition model", "Goal test and path cost", "Heuristic function"], "ans": 3, "id": 27}, {"topic": "Problems & Problem Spaces", "diff": "Medium", "type": "Fill in the Blank", "fmt": "fill", "q": "The set of all states reachable from the initial state by any sequence of actions is called the ________ space.", "hint": "Rhymes with 'estate'.", "exp": "The state space forms a graph: nodes are states, edges are actions.", "app": false, "search": false, "accept": ["state"], "answerText": "State", "id": 28}, {"topic": "Problems & Problem Spaces", "diff": "Medium", "type": "Problem Solving", "fmt": "fill", "q": "8-puzzle: the blank is in the TOP-MIDDLE square. How many legal actions (blank moves) are available? (enter a number)", "hint": "Count the directions that do not leave the board.", "exp": "The blank can move left, right or down, but not up. Corner = 2, edge = 3, centre = 4 moves.", "app": false, "search": true, "accept": ["3", "three"], "answerText": "3", "id": 29}, {"topic": "State Space Search", "diff": "Hard", "type": "Problem Solving", "fmt": "fill", "q": "Water-jug problem: you have a 4-litre jug and a 3-litre jug (no markings), a tap and a drain. Starting with both empty, what is the MINIMUM number of actions (fill / empty / pour) to get exactly 2 litres in the 3-litre jug? (enter a number)", "hint": "Fill the small jug first and keep pouring.", "exp": "(0,0) → fill 3L (0,3) → pour into 4L (3,0) → fill 3L (3,3) → pour into 4L until full (4,2). That is 4 actions, and the 3-litre jug holds 2 L. BFS confirms nothing shorter exists.", "app": false, "search": true, "accept": ["4", "four"], "answerText": "4", "id": 30}, {"topic": "State Space Search", "diff": "Hard", "type": "Scenario", "fmt": "opts", "q": "A warehouse robot must reach a shelf in a grid. A student formulates: State = robot's cell; Actions = move N/S/E/W if no wall; Goal test = battery above 50%; Path cost = number of moves. Which part is wrongly formulated?", "hint": "What is the robot trying to reach?", "exp": "The goal test must check whether the robot is AT the shelf cell. Battery level is unrelated to the task.", "app": true, "search": true, "opts": ["State", "Actions", "Goal test", "Path cost"], "ans": 2, "id": 31}, {"topic": "Production Systems", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "A production system consists of a set of rules, a global database (working memory), and a ________ that decides which applicable rule to fire.", "hint": "It controls which rule fires.", "exp": "The control strategy (including conflict resolution) chooses among applicable rules.", "app": false, "search": false, "opts": ["Control strategy", "Compiler", "Heuristic only", "Neural network"], "ans": 0, "id": 32}, {"topic": "Production Systems", "diff": "Hard", "type": "MCQ", "fmt": "opts", "q": "Which statement defines a PARTIALLY COMMUTATIVE production system?", "hint": "Order does not matter.", "exp": "A partially commutative system does not depend on rule ordering for reaching the same result. If it is also monotonic (a rule never blocks later rules that were applicable), it is commutative. Theorem proving is the typical example.", "app": false, "search": false, "opts": ["Every rule can be applied at most once", "If a sequence of rules transforms state x into y, any allowable permutation of those rules also transforms x into y", "Rules are applied in strictly alphabetical order", "Applying a rule always makes the database larger"], "ans": 1, "id": 33}, {"topic": "Production Systems", "diff": "Hard", "type": "Scenario", "fmt": "opts", "q": "A medical expert system has the rules R1: IF fever AND cough THEN flu-suspect. R2: IF flu-suspect AND body-ache THEN recommend-test. Working memory = {fever, cough, body-ache}. Using forward chaining, what is the final fact added?", "hint": "Rules can trigger other rules.", "exp": "R1 fires first and adds flu-suspect. Then R2's conditions are satisfied, so it fires and adds recommend-test.", "app": true, "search": false, "opts": ["flu-suspect only", "recommend-test", "nothing, because no rule matches", "body-ache"], "ans": 1, "id": 34}, {"topic": "Problem Characteristics", "diff": "Medium", "type": "Match the Following", "fmt": "match", "q": "Match each problem with the correct characteristic from Rich & Knight.", "hint": "Can you undo the step?", "exp": "Theorem proving: a lemma, once proven, stays useful (ignorable). 8-puzzle: you can undo a move (recoverable). Chess: a move cannot be taken back (irrecoverable). Bridge: unknown cards give uncertain outcomes.", "app": false, "search": false, "left": ["Proving a mathematical theorem", "8-puzzle", "Chess", "Playing bridge (opponent cards hidden)"], "right": ["Ignorable steps", "Recoverable steps", "Irrecoverable steps", "Uncertain outcome"], "id": 35}, {"topic": "Problem Characteristics", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "In which problem must the SOLUTION be a path (a sequence of actions) rather than just a final state?", "hint": "Does the route matter?", "exp": "In the water-jug problem you must report how to reach the goal. For sentence interpretation the answer is just the interpretation, i.e. a state.", "app": false, "search": false, "opts": ["Finding the correct interpretation of a sentence", "The water-jug problem", "Neither", "Both"], "ans": 1, "id": 36}, {"topic": "Issues in Search Design", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A diagnostic program knows exactly ONE goal state. Moving forward from the start, each state has about 25 successors; moving backward from the goal, each state has only about 3 predecessors. Which strategy is best?", "hint": "Prefer the smaller branching factor.", "exp": "Choose the direction with the smaller branching factor. Here backward search explores far fewer states.", "app": true, "search": true, "opts": ["Forward search", "Backward search", "Random search", "Neither – the problem cannot be solved"], "ans": 1, "id": 37}, {"topic": "Issues in Search Design", "diff": "Easy", "type": "True/False", "fmt": "opts", "q": "Representing the search space as a graph (instead of a tree) helps avoid re-expanding repeated states.", "hint": "Think visited list.", "exp": "A tree may regenerate the same state through different paths. A graph (or an explored/closed list) detects and avoids repeats.", "app": false, "search": false, "opts": ["True", "False"], "ans": 0, "id": 38}, {"topic": "BFS", "diff": "Medium", "type": "Problem Solving", "fmt": "opts", "q": "Graph (children listed alphabetically; G is the goal):\nS → A, B\nA → C, D\nB → E, F\nD → G\nF → G\nIn what order does BFS visit (dequeue) nodes until G is reached?", "hint": "Level by level, left to right.", "exp": "BFS visits level by level: S | A B | C D E F | G. FIFO queue.", "app": false, "search": true, "opts": ["S A B C D E F G", "S A C D G", "S B F G", "S A B D G"], "ans": 0, "id": 39}, {"topic": "BFS", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "What is the space complexity of BFS for branching factor b and goal depth d?", "hint": "It keeps the whole frontier.", "exp": "BFS stores every node of the frontier, which grows exponentially with depth.", "app": false, "search": false, "opts": ["O(bd)", "O(b^d)", "O(d)", "O(b+d)"], "ans": 1, "id": 40}, {"topic": "BFS", "diff": "Medium", "type": "Problem Solving", "fmt": "fill", "q": "A search tree has branching factor b = 3. How many nodes (including the root) exist in the tree down to depth 3? (enter a number)", "hint": "Add 3^0 up to 3^3.", "exp": "1 + 3 + 9 + 27 = 40.", "app": false, "search": true, "accept": ["40", "forty"], "answerText": "40", "id": 41}, {"topic": "BFS", "diff": "Medium", "type": "Assertion–Reason", "fmt": "opts", "q": "Assertion (A): BFS is optimal for every possible step-cost structure.\nReason (R): BFS always expands the shallowest unexpanded node first.", "hint": "Shallowest does not mean cheapest.", "exp": "A is false: BFS finds the shallowest goal, which is the cheapest only when all step costs are equal. R is true as stated.", "app": false, "search": false, "opts": ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is NOT the correct explanation of A", "A is true, but R is false", "A is false, but R is true"], "ans": 3, "id": 42}, {"topic": "DFS", "diff": "Medium", "type": "Problem Solving", "fmt": "opts", "q": "Graph (children listed alphabetically; G is the goal):\nS → A, B\nA → C, D\nB → E, F\nD → G\nF → G\nIn what order does DFS (LIFO stack, alphabetical child preference) visit nodes until G is reached?", "hint": "Go deep first; backtrack at dead ends.", "exp": "S → A → C (dead end, backtrack) → D → G.", "app": false, "search": true, "opts": ["S A B C D E F G", "S A C D G", "S B E F G", "S A D G"], "ans": 1, "id": 43}, {"topic": "DFS", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "What is the space complexity of depth-first search (tree search) for branching factor b and maximum depth m?", "hint": "Memory is its big advantage.", "exp": "DFS stores only the current path plus unexpanded siblings, so memory is linear in depth.", "app": false, "search": false, "opts": ["O(b^m)", "O(bm)", "O(m^b)", "O(b+m)"], "ans": 1, "id": 44}, {"topic": "Iterative Deepening", "diff": "Medium", "type": "Scenario", "fmt": "opts", "q": "A puzzle solver on a low-memory phone does not know how deep the solution is, and all moves cost the same. Which uninformed strategy is the best choice?", "hint": "Combine memory-light with complete.", "exp": "IDDFS has DFS's linear memory and BFS's completeness and optimality for uniform step cost.", "app": true, "search": true, "opts": ["Breadth-first search", "Iterative deepening DFS", "Plain depth-first search", "Greedy best-first search"], "ans": 1, "id": 45}, {"topic": "Iterative Deepening", "diff": "Hard", "type": "Problem Solving", "fmt": "fill", "q": "The goal is at depth 3. IDDFS runs with limits 0, 1, 2, 3. How many times is the root node generated in total? (enter a number)", "hint": "One per iteration.", "exp": "One generation per iteration (limits 0, 1, 2, 3) = d + 1 = 4.", "app": false, "search": true, "accept": ["4", "four"], "answerText": "4", "id": 46}, {"topic": "Iterative Deepening", "diff": "Hard", "type": "Assertion–Reason", "fmt": "opts", "q": "Assertion (A): The repeated regeneration of upper-level nodes in IDDFS does not make it much slower than BFS.\nReason (R): In a tree with uniform branching factor, most nodes are at the deepest level.", "hint": "Where do most nodes live?", "exp": "The bottom level dominates the total node count, so the repeated work on upper levels is a small fraction. Time is still O(b^d).", "app": false, "search": false, "opts": ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is NOT the correct explanation of A", "A is true, but R is false", "A is false, but R is true"], "ans": 0, "id": 47}, {"topic": "Hill Climbing", "diff": "Easy", "type": "MCQ", "fmt": "opts", "q": "Hill climbing is stuck because all neighbouring states have exactly the same value as the current state. This is called a:", "hint": "Flat land.", "exp": "On a plateau there is no uphill direction, so a simple hill climber cannot decide where to go.", "app": false, "search": false, "opts": ["Ridge", "Plateau (flat region)", "Global maximum", "Cycle"], "ans": 1, "id": 48}, {"topic": "Hill Climbing", "diff": "Medium", "type": "Match the Following", "fmt": "match", "q": "Match each hill-climbing variant with how it works.", "hint": "Match the key word.", "exp": "Steepest-ascent looks at all neighbours. Stochastic picks randomly among improvements. First-choice takes the first improvement it generates (good with many neighbours). Random-restart escapes local maxima by trying many starts.", "app": false, "search": false, "left": ["Steepest-ascent", "Stochastic", "First-choice", "Random-restart"], "right": ["Moves to the best neighbouring state", "Chooses randomly among the uphill moves", "Generates successors randomly until one is better than current", "Repeats from random initial states"], "id": 49}, {"topic": "Hill Climbing", "diff": "Hard", "type": "Problem Solving", "fmt": "opts", "q": "Heights along a line A–G are A=3, B=5, C=8, D=6, E=9, F=12, G=10. Hill climbing starts at A and moves to a higher neighbour if one exists. Where does it stop?", "hint": "Follow it step by step.", "exp": "A→B→C. At C the neighbours B(5) and D(6) are both lower, so it stops at a local maximum (8) and misses the global maximum F (12).", "app": false, "search": true, "opts": ["At F (value 12)", "At C (value 8)", "At E (value 9)", "At G (value 10)"], "ans": 1, "id": 50}, {"topic": "Hill Climbing", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "How does simulated annealing try to escape local maxima?", "hint": "Metal cooling analogy.", "exp": "Occasional downhill moves let it leave local maxima. As temperature cools, the algorithm becomes more like pure hill climbing.", "app": false, "search": false, "opts": ["It never accepts worse moves", "It accepts some worse moves with a probability that decreases as 'temperature' falls", "It restarts only once", "It uses a priority queue of all states"], "ans": 1, "id": 51}, {"topic": "Hill Climbing", "diff": "Hard", "type": "Scenario", "fmt": "opts", "q": "A drone's route optimiser uses hill climbing but often ends at poor routes. Which cheap fix is most appropriate?", "hint": "Try many starting points.", "exp": "Restarting from many random routes and keeping the best result greatly raises the chance of finding a good (or global) optimum.", "app": true, "search": false, "opts": ["Use random-restart hill climbing", "Remove the heuristic", "Switch to DFS", "Stop after one step"], "ans": 0, "id": 52}, {"topic": "Heuristic Search", "diff": "Medium", "type": "MCQ", "fmt": "opts", "q": "A heuristic h(n) is admissible if:", "hint": "Optimistic estimates.", "exp": "Admissible = optimistic. This guarantees optimality for A* tree search.", "app": false, "search": false, "opts": ["It never overestimates the true cost to reach the goal", "It always equals the true cost", "It is always greater than g(n)", "It is zero at the start node"], "ans": 0, "id": 53}, {"topic": "Heuristic Search", "diff": "Hard", "type": "Problem Solving", "fmt": "fill", "q": "Current state (rows): [2 8 3 / 1 6 4 / 7 _ 5]\nGoal state (rows):    [1 2 3 / 8 _ 4 / 7 6 5]\nUsing h2 = sum of Manhattan distances of the tiles (blank not counted), what is h2 for the current state? (enter a number)", "hint": "Only 4 tiles are out of place; one of them is 2 away.", "exp": "Tile 2: 1 move; tile 8: 2; tile 1: 1; tile 6: 1; all others are in place. Total = 5. (Misplaced-tiles h1 = 4.)", "app": false, "search": true, "accept": ["5", "five"], "answerText": "5", "id": 54}, {"topic": "Heuristic Search", "diff": "Hard", "type": "MCQ", "fmt": "opts", "q": "In the 8-puzzle, h1 = number of misplaced tiles and h2 = sum of Manhattan distances. Both /* ---------- quiz engine ---------- */
function newRun(mode, queue, extra) {
  return Object.assign({mode, queue, i: 0, score: 0, streak: 0, best: 0, correct: 0, skipped: 0,
    life: mode === 'realm' ? {fifty: 2, hint: 2, time: 1, skip: 1} : {fifty: 2, hint: 3, time: 1, skip: 1},
    log: [], timer: null, bonus: {puz: 0, csp: 0}, t0: 0}, extra || {});
}
function startRealm(i) {
  const r = REALMS[i], pool = r.pool;
  const hard = shuffle(pool.filter(q => q.diff === 'Hard')), med = shuffle(pool.filter(q => q.diff === 'Medium'));
  const boss = hard[0] || med[0] || pool[0];
  R = newRun('realm', [...shuffle(pool.filter(q => q !== boss)), boss], {realm: r, ri: i});
  showQ();
}
function startQuick(list) {
  const n = cfg.count === 'All' ? list.length : Math.min(cfg.count, list.length);
  R = newRun('quick', list.slice(0, n)); showQ();
}
function stopTimer() { if (R && R.timer) { clearInterval(R.timer); R.timer = null; } }
const isBoss = () => R.mode === 'realm' && R.i === R.queue.length - 1;
const dots = () => '<div class="dots">' + R.queue.map((q, i) => { const l = R.log[i]; return `<i class="${i < R.log.length ? (l.ok === null ? 'skip' : l.ok ? 'ok' : 'bad') : (i === R.i ? 'cur' : '')}"></i>`; }).join('') + '</div>';

function showQ() {
  stopTimer();
  const q = R.queue[R.i], boss = isBoss();
  R.q = q; R.answered = false; R.hintUsed = false; R.fiftyUsed = false; R.timeBoost = false;
  R.limit = LIMIT[q.diff] + (q.fmt !== 'opts' ? 15 : 0) + (q.type === 'Problem Solving' ? 15 : 0);
  R.t = R.limit; R.deadline = Date.now() + R.limit * 1000;
  R.order = q.fmt === 'opts' ? shuffle(q.opts.map((_, i) => i)) : null;
  if (q.type === 'True/False') R.order = [0, 1];
  if (q.type === 'Assertion–Reason') R.order = [0, 1, 2, 3];
  if (q.fmt === 'match') R.mopts = shuffle(q.right);
  let body = '';
  if (q.fmt === 'opts') {
    body = '<div class="opts">' + R.order.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="k">${String.fromCharCode(65 + k)}</span><span>${esc(q.opts[oi])}</span></button>`).join('') + '</div>';
  } else if (q.fmt === 'fill') {
    body = `<input type="text" id="fi" placeholder="Type your answer…" autocomplete="off"><button class="btn" id="sub">Submit answer</button>`;
  } else {
    body = q.left.map((l, k) => `<div class="rowm"><div class="l">${esc(l)}</div><select class="ms"><option value="">— choose —</option>${R.mopts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`).join('') + `<button class="btn" id="sub">Submit matches</button>`;
  }
  const noFifty = q.fmt !== 'opts' || q.type === 'True/False';
  const title = R.mode === 'realm' ? `${R.realm.icon} ${R.realm.name}` : '⚡ Quick Battle';
  app.innerHTML = `
  <div class="hud"><div class="stat">${title}</div><div class="stat">Question <b>${R.i + 1}</b>/${R.queue.length}</div><div class="stat">Score <b id="sc">${R.score}</b></div><div class="stat">🔥 <b>${R.streak}</b></div><div class="stat">⏳ <b id="tl">${R.t}</b>s</div></div>
  ${dots()}
  <div class="bar tbar" id="tb" style="margin-bottom:12px"><div style="width:100%"></div></div>
  <div class="card qcard ${boss ? 'boss' : ''}" id="qc">
    ${boss ? '<div class="bossbanner">⚔ BOSS BATTLE · DOUBLE POINTS ⚔</div>' : ''}
    <div class="chips"><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.type)}</span><span class="chip ${q.diff}">${q.diff}</span>${q.app ? '<span class="chip app">Real-world</span>' : ''}${q.search ? '<span class="chip srch">Search / State space</span>' : ''}</div>
    <div class="q">${esc(q.q)}</div>${body}
    <div class="lifelines">
      <button class="ll" id="l50" ${noFifty || !R.life.fifty ? 'disabled' : ''}></button><button class="ll" id="lh" ${!R.life.hint ? 'disabled' : ''}></button>
      <button class="ll" id="lt" ${!R.life.time ? 'disabled' : ''}></button><button class="ll" id="ls" ${!R.life.skip ? 'disabled' : ''}></button></div>
    <div id="hint"></div><div id="fb"></div></div>`;
  labelLL(); bindQ();
  R.timer = setInterval(tick, 250);
  const fi = $('#fi'); if (fi) fi.focus();
}
function labelLL() {
  $('#l50').textContent = `🧪 Potion 50:50 (${R.life.fifty})`; $('#lh').textContent = `🦉 Owl hint (${R.life.hint})`;
  $('#lt').textContent = `⏳ +15s (${R.life.time})`; $('#ls').textContent = `📜 Skip (${R.life.skip})`;
}
function tick() {
  R.t = (R.deadline - Date.now()) / 1000;
  const r = Math.max(0, R.t); $('#tl').textContent = Math.ceil(r);
  const tb = $('#tb'); tb.firstElementChild.style.width = (r / R.limit * 100) + '%'; tb.classList.toggle('low', r <= 10);
  if (r <= 0) finish(false, '(time up)');
}
function bindQ() {
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => submit(+b.dataset.oi));
  const sub = $('#sub'); if (sub) sub.onclick = () => submit();
  const fi = $('#fi'); if (fi) fi.onkeydown = e => { if (e.key === 'Enter') submit(); };
  $('#l50').onclick = fifty; $('#lh').onclick = hint; $('#lt').onclick = addTime; $('#ls').onclick = skip;
}
function refreshLL() {
  labelLL(); const q = R.q;
  $('#l50').disabled = R.answered || q.fmt !== 'opts' || q.type === 'True/False' || !R.life.fifty || R.fiftyUsed;
  $('#lh').disabled = R.answered || !R.life.hint || R.hintUsed;
  $('#lt').disabled = R.answered || !R.life.time || R.timeBoost;
  $('#ls').disabled = R.answered || !R.life.skip;
}
function fifty() {
  if (R.answered || R.fiftyUsed || !R.life.fifty) return;
  R.life.fifty--; R.fiftyUsed = true;
  const wrong = shuffle(R.q.opts.map((_, i) => i).filter(i => i !== R.q.ans)).slice(0, 2);
  document.querySelectorAll('.opt').forEach(b => { if (wrong.includes(+b.dataset.oi)) b.classList.add('gone'); });
  refreshLL();
}
function hint() {
  if (R.answered || R.hintUsed || !R.life.hint) return;
  R.life.hint--; R.hintUsed = true;
  $('#hint').innerHTML = `<div class="hintbox">🦉 <b>The owl whispers:</b> ${esc(R.q.hint)}</div>`; refreshLL();
}
function addTime() {
  if (R.answered || R.timeBoost || !R.life.time) return;
  R.life.time--; R.timeBoost = true; R.deadline += 15000; R.t += 15; R.limit += 15; refreshLL();
}
function skip() {
  if (R.answered || !R.life.skip) return;
  R.life.skip--; R.skipped++; stopTimer();
  R.log.push({q: R.q, ok: null, user: '(skipped)', pts: 0}); next();
}
function fillOK(q, user) {
  const u = norm(user).replace(/^(the|a|an) /, '');
  return q.accept.some(a => { const n = norm(a); if (u === n) return true;
    if (/^\d+$/.test(n)) { const tk = u.split(' '); return tk[0] === n && tk.length <= 3 && !/\d/.test(tk.slice(1).join('')); } return false; });
}
function correctText(q) {

      <p class="lead" style="font-size:.82rem;margin:14px 0 0">Scoring: 30 points, −1 for every move beyond 8 and −1 per hint (never below 15). Easy tip: T (Tasmania) touches nobody, so any colour works, and SA touches five regions, so give it a colour no neighbour has.</p>
      <button class="btn ghost" id="cb">← Bonus menu</button></div>`;
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { pick = b.dataset.c; render(); });
    document.querySelectorAll('.nd').forEach(g => g.onclick = () => {
      if (solved) return; const r = g.dataset.r;
      if (col[r] === pick) delete col[r]; else col[r] = pick; moves++; hintVar = null; msg = '';
      if (Object.keys(col).length === 7 && !bad().length) { solved = true; const pts = Math.max(15, 30 - Math.max(0, moves - 8) - hints);
        c.bonus.csp = Math.max(c.bonus.csp, pts); c.sync(); sfx.win();
        msg = `<div class="fb ok" style="text-align:left"><h3>🎉 Perfect map! ${stars3(pts)}</h3>Completed in ${moves} moves. You earned <span class="pts">+${pts}</span> bonus points (best so far: ${c.bonus.csp}/30).</div>`; setTimeout(confetti, 50); }
      render();
    });
    $('#ch').onclick = () => {
      const un = Object.keys(RG).filter(r => !col[r]);
      if (!un.length) { msg = '<div class="hintbox" style="text-align:left">Every region is painted. Remove a conflicting colour and try again.</div>'; render(); return; }
      const sc = r => [dom(r).length, -nbr(r).filter(n => !col[n]).length];
      un.sort((a, b) => { const x = sc(a), y = sc(b); return x[0] - y[0] || x[1] - y[1]; });
      hintVar = un[0]; hints++;
      msg = `<div class="hintbox" style="text-align:left">💡 <b>MRV:</b> choose <b>${hintVar}</b> next. It has the fewest legal colours (${dom(hintVar).length}); ties are broken by the degree heuristic (most unassigned neighbours).</div>`; render();
    };
    $('#cr').onclick = () => { Object.keys(col).forEach(k => delete col[k]); col.WA = 'red'; moves = 0; hintVar = null; solved = false; msg = ''; render(); };
    $('#cb').onclick = () => showBonusHub(c);
  }
  render();
}
showTitle();


$('#soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('#soundBtn').onclick = () => { soundOn = !soundOn; $('#soundBtn').textContent = soundOn ? '🔊' : '🔇'; try { localStorage.setItem('nq_sound', soundOn ? 'on' : 'off'); } catch (e) {} if (soundOn) sfx.ok(); };
</script>
